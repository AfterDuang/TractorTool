name: Build Windows distribution

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Build and statically verify distribution
        run: |
          $compiler = ./scripts/Get-InnoCompiler.ps1 -Output "$env:GITHUB_WORKSPACE/artifacts/inno"
          ./scripts/Build-Distribution.ps1 -Output "$env:GITHUB_WORKSPACE/artifacts/distribution" -CompilerPath $compiler
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TractorTool-win-x64
          path: artifacts/distribution/assets/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: TractorTool-win-x64
          path: artifacts/release
      - name: Verify release identity and assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          ./scripts/Verify-Distribution.ps1 -AssetsDir ./artifacts/release -ExpectedTag $env:RELEASE_TAG -ExpectedCommit $env:SOURCE_COMMIT
      - name: Create draft with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath ./artifacts/release -File | ForEach-Object FullName)
          $options = @('--draft', '--verify-tag', '--generate-notes', '--title', "TractorTool $env:RELEASE_TAG")
          if ($env:RELEASE_TAG.Contains('-')) { $options += '--prerelease' }
          gh release create $env:RELEASE_TAG @assets @options
          if ($LASTEXITCODE -ne 0) {
            throw '创建或上传失败，可能遗留不完整草稿。请到仓库 Releases 核对同标签：仅删除本次失败的草稿后重跑此 job；已有正式 Release 不得覆盖。'
          }
